services:
  db:
    image: postgres:16-alpine
    container_name: record-db
    environment:
      - POSTGRES_DB=record_education
      - POSTGRES_USER=record_user
      - POSTGRES_PASSWORD=record_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U record_user -d record_education"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: record-backend
    env_file: ./backend/.env
    environment:
      - DEBUG=False
      - DATABASE_URL=postgres://record_user:record_pass@db:5432/record_education
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1
      - SECURE_SSL_REDIRECT=False
    volumes:
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: record-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
